<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=-, initial-scale=1.0">
    <title>Exercise no. - 5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        header {
            position: sticky;
            top: 0;
        }

        nav {
            background-color: rgb(17, 167, 187);
            height: 70px;
        }

        .container {
            background-color: rgb(11, 242, 38);
            margin: 12px 34px;
            text-align: center;
            padding: 55px 50px;
        }

        .box1 {
            background-color: blue;
            height: 50vh;
            width: 35%;
            display: inline-block;
            margin: 0 12px;

        }

        .box2 {
            background-color: rgb(251, 0, 255);
            height: 50vh;
            width: 35%;
            display: inline-block;
            margin: 0 12px;

        }

        footer {
            height: 100px;
            background-color: bisque;
            font-size: larger;
        }

        .text-box {

            padding: 50px;
            border: 2px solid white;
            margin: 100px 34vw;
            font-size: 2em;
            border-radius: 20px;
            font-weight: bolder;


        }

        main {
            background-color: black;
            color: azure;
            padding: 50px;
        }

        .orange-box {
            height: 24px;
            width: 24px;
            background-color: orange;
            border-radius: 60px;
            bottom: 12px;
            right: 23px;
            position: fixed;
        }
    </style>
</head>

<body>
    <header>
        <nav>

        </nav>
    </header>
    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>
        <div class="text-box">
            <p>

                Welcome to my first website:-
            <ol>
                <li>
                    <a href="http://www.instagram.com">Instagram</a>
                </li>
                <li>
                    <a href="http://www.facebook.com">Facebook</a>
                </li>
                <li>
                    <a href="http://www.youtube.com">Youtube</a>
                </li>
            </ol>

            </p>
            <div class="orange-box">

            </div>
        </div>

    </main>
    <footer>
        hey

    </footer>
</body>

</html>
