<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortFolio-Website</title>
    <link rel="shortcut icon" href="assets/Lion-Head-Logo-Design.jpg" type="image/x-icon">
</head>
<link rel="stylesheet" href="Style/Style.css">
<link rel="stylesheet" href="Style/home.css">
<link rel="stylesheet" href="Style/services.css">
<link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />

<body>
    <div class="main-container">
        <header>
            <div class="brand-info">
                <img src="assets/hacker.jpeg" alt="Logo" title="Logo" loading="lazy">

                <h2>PortFolio</h2>
            </div>
            <div class="menu-area">
                <input type="checkbox" id="menu-toggle" hidden />
                <label for="menu-toggle" class="menu-icon"><i class="ph ph-list"></i>
                </label>
                <label for="menu-toggle" id="overlay"></label>


                <nav>
                    <a href="#" style="--i:1" data-tab="home" class="navlink active">Home</a>
                    <a href="#" style="--i:2" data-tab="services" class="navlink">Services</a>
                    <a href="#" style="--i:3" data-tab="about" class="navlink">About</a>
                    <a href="#" style="--i:4" data-tab="project" class="navlink">Project</a>
                    <a href="#" style="--i:5" data-tab="contact" class="navlink">Contact</a>
                </nav>
            </div>
        </header>
        <section id="home" class="content active">
            <div class="details">
                <h2><span>Coder</span>
                    Vinay</h2>
                <h3>
                    I' am
                    <span id="typing-span"></span>
                </h3>
                <p>B.Tech CSE Student | Aspiring Full Stack Developer | HTML, CSS, JavaScript, Tailwind CSS, & JAVA
                    |Open Internship Opportunities

                    Greater Jabalpur Area
                </p>
                <div class="bottem">

                    <button class="btn">Download CV</button>


                    <div class="social-icon">

                        <a href="#"><i class="ph ph-github-logo"></i></a>
                        <a href="#"><i class="ph ph-linkedin-logo"></i></a>
                        <a href="#"><i class="ph ph-instagram-logo"></i> </a>
                        <a href="#"><i class="ph ph-youtube-logo"></i></a>

                    </div>

                </div>




            </div>
            <div class="img-container">
                <img src="assets/Profile-imgg.jpeg" alt="Profile Picture" title="Profile" loading="lazy">

            </div>
        </section>


        <section id="services" class="content">
            <h2>
                My <span>Services</span>
            </h2>
            <div class="service-list">
             
            </div>


        </section>


        <section id="about" class="content">About</section>
        <section id="project" class="content">Project</section>
        <section id="contact" class="content">Contact</section>
    </div>
    <script src="Script.js" type="module" defer></script>

</body>

</html>
