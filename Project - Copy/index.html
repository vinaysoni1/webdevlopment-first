<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Weather Demo</title>
	<link rel="stylesheet" href="index.css">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_right_alt" />

<body>
	<!-- <img src="background2.jpg" alt=""> -->
	<!-- Navigation Bar -->
	<div class="main-screen">
		<div class="main-nav"></div>
		<nav>
			<a href="#" class="Icon">For Business</a>
			<a href="#" class="I">|</a>
			<a href="#" class="warning">Warnings</a>
			<a href="#" class="data">Data Suite</a>
			<a href="#" class="forensics">Forensics</a>
			<a href="#" class="advertising">Advertising</a>
			<a href="#" class="super">Superior Accuracy™</a>
		</nav>


		<div class="second-header">
			<div class="header">
				<img src="AW_RGB_Rev_R.svg" alt="">
			</div>
			<div class="menu">
				<img src="menu.svg" alt="">
			</div>
		</div>

		<div class="container">
			<div class="main-box">

				<!-- Search bar container -->
				<div class="InputContainer">
					<img id="search" src="search bar.png">
					<input placeholder=" Search Your Address and ZIP Code" id="input" class="input" name="text"
						type="text">


					<form>
						<p>

							<select id="pet-select">
								<option value="cat">
									<span class="option-label">News</span>
								</option>
								<option value="dog">
									<span class="option-label">Videos</span>
								</option>
								<option value="hamster">
									<span class="option-label">Location</span>
								</option>

							</select>
						</p>
					</form>
				</div>

				<!-- main location feature -->
				<div class="feature_location">
					<div class="location">
						<span id="recent-location">RECENT LOCATION </span>
					</div>
					<div class="feature_Location-location">
						<div class="list-feature">
							<ul class="list">
								<div class="list-style">
									<li id="Bhopal">
										<h1>Bhopal</h1>
									</li>
									<li id="india">
										<h1>India</h1>
									</li>
									<li id="temperature" style="display: flex; margin-top: 5px;">
										<img src="34.svg" alt="Temperature">
										<h3>34°C</h3>

									</li>
									<li style="display: flex; margin-top: 5px;">
										<span id="realfeel">RealFeel®</span>
										<span id="degree">32°C</span>
									</li>
								</div>
							</ul>
						</div>

					</div>
				</div>
			</div>
		</div>




		<!-- second part -->


		<div class="blank-box">
			<div class="box-1"></div>
			<div class="box-2"></div>

		</div>
		<!-- Third part -->
		<div class="two-coloumn-pagecontent">
			<div class="fast-coloumn">
				<div class="page-content">
					<div class="new-nav">
						<span id="fist-text">INDIA WEATHER RADER</span>
						<span id="second-text">See More
							<span class="material-symbols-outlined">
								arrow_right_alt
							</span>
						</span>
					</div>
					<div class="map-image">
						<img src="0.jpg" alt="">
					</div>

				</div>
			</div>
			<div class="second-coloumn">
				<div class="box-1">
					<div class="box-1-1">

					</div>

				</div>
				<div class="box-22">
					<div class="box-2-2">
						<p class="tittle"> Top Stories</p>

					</div>
				</div>
			</div>
		</div>
	</div>



</body>


</html>
