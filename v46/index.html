<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation</title>
    <style>
        .container{
             background-color: brown;
            height: 120px;
            width: 120px;

        }
        .box{
            /* background-color: aqua; */
            height: 30px;
            width: 30px;
            border-radius: 60px;
            font-size: 20px;
            /* animation-name: VinayAnimation;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(0.55,-0.02, 0, 1.01);
            animation-delay: 2s; */
            /* animation-direction: alternate-reverse; */
            /* animation-play-state: paused; */
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: VinayAnimation 1s ease-in-out  1s 1,
                       Vinay 1s ease-in-out   1s 1 ;

        }
        @keyframes VinayAnimation{
            From{
                 background-color: rgb(255, 230, 8);
            }
            to{
               /* transform: translateX(200px); */
               background-color: deeppink;
            }

        }
        @keyframes vinay{
            0%{
                transform:rotate(45deg) ;

            }
            20%{
                transform:rotate(90deg) ;
            }
            50%{
                 transform:rotate(135deg) ;

            }
            80%{
                 transform:rotate(205deg) ;

            }
            100%{
                 transform:rotate(300deg) ;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            box

        </div>
    </div>
    
</body>
</html>
