<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to React</title>
</head>
<style>

.box{
    height: 100px;
    width: 100px;
    border: 2px solid black;
    padding: 2px;
}
</style>
<body>
    <div class="box box1">I am box 1</div>
    <div class="box box2">I am box 2</div>
    <div class="box box3">I am box 3</div>
    
</body>

<script>
    setTimeout(()=>{
        document.querySelector(".box1").innerHTML="hii"
    },1000)
    setTimeout(()=>{
        document.querySelector(".box2").innerHTML="hii hii"
    },2000)
    setTimeout(()=>{
        document.querySelector(".box3").innerHTML="hii hii hii"
    },3000)
</script>
</html>
