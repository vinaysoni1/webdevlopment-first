<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS position property</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    .box {
      border: 2px solid black;
      height: 135px;
      width: 80vw;
      margin: 3px;
      padding: 3px;

    }

    .box1 {

      background-color: aqua;
      /* position:absolute;
            top:8px ;
            left:10px; */
      position: sticky;
      top: 0px;
      height: 50px;
      width: 70%;
      margin: 0;
      padding: 0;
    }

    .box2 {

      background-color: aquamarine;
      /* position: relative; */
      /* top: 50px;
           left: 50px;
           z-index: 1px;  */
    }

    .box3 {

      background-color: bisque;
      /* position: fixed; */
      bottom: 0px;
      left: 8px;
      height: 133px;
    }

    .box4 {

      background-color: burlywood;
    }

    .parent {
      padding: 43px;
      margin: 3px;
      border: 4px solid rgb(218, 10, 183);
      position: absolute;
      /* expection */
      /* transform: translate(0); */
      /* filter: invert(0); */
      /* perspective: 0em; */
    }
  </style>
</head>

<body>
  <div class="parent">
    <div class=" box box1"></div>
    <div class=" box box2"></div>
    <div class=" box box3"></div>
    <div class=" box box4"></div>
  </div>
</body>

</html>
