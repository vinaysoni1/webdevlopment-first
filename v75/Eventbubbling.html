<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>event bubbling</title>
    <style>
        .child {
            background-color: lime;
            border: 2px solid rgb(138, 66, 66);
            margin: 20px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .childcontainer {
            background-color: yellow;
            border: 2px solid black;
            margin: 20px;
            padding: 20px;

        }

        .container {
            background-color: lightblue;
            border: 2px solid black;
            margin: 20px;
            padding: 20px;

        }
    </style>
</head>

<body>
    <div class="container">
        <section class="childcontainer">
            <div class="child">
                I am a Child
            </div>
        </section>
    </div>
    <script>
        document.querySelector(".child").addEventListener("click", (e) => {
            e.stopPropagation();
            alert("you clicked child");
        })

        document.querySelector(".childcontainer").addEventListener("click", () => {
            e.stopPropagation();
            alert("you clicked childcontainer");
        })

        document.querySelector(".container").addEventListener("click", () => {
            //   e.stopPropagation();
            alert("you clicked container");
        })

        function getrandomcolor() {
            let val1 = Math.ceil(0 + Math.random() * 255)
            let val2 = Math.ceil(0 + Math.random() * 255)
            let val3 = Math.ceil(0 + Math.random() * 255)
            return `rgb(${val1}, ${val2}, ${val3})`;
        }
        // let a = setInterval(() => {
        //     document.querySelector(".childcontainer").style.background = getrandomcolor();
        // }, 500)
        // console.log(a);

        // let b= setInterval(() => {
        //     document.querySelector(".container").style.background = getrandomcolor();
        // }, 500)
        // console.log(b);

        //  let c= setInterval(() => {
        //     document.querySelector(".child").style.background = getrandomcolor();
        // }, 500)
        // console.log(c);



        let a = setTimeout(() => {
            document.querySelector(".childcontainer").style.background = getrandomcolor();
        }, 5000)
        console.log(a);

        let b= setTimeout(() => {
            document.querySelector(".container").style.background = getrandomcolor();
        }, 5000)
        console.log(b);

         let c= setTimeout(() => {
            document.querySelector(".child").style.background = getrandomcolor();
        }, 5000)
        console.log(c);
    </script>
</body>
</html>
