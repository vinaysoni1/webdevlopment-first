<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS box model</title>
    <style>
        body {
            background-color: #c4ff12;
        }

        * {
            margin: 0;
            padding: 0;
        }

        .box {
            background-color: aqua;
        }

        .box1 {

            background-color: blue;
            padding: 10px;
            margin: 30px;
            border: 2px solid black;
            height: 50px box sizing: border- box;

        }

        .box2 {
            background-color: darkorange;
            padding: 10px;
            margin: 20px;
            border: 2px solid rgb(15, 15, 1);
            height: 50px box sizing: border- box;

        }
    </style>
</head>

<body>
    <h1>
        css box model :-
    </h1>
    <div>
        <ul>
            <li>border</li>
            <li>padding</li>
            <li>mirgen</li>
        </ul>
    </div>
    <div class="box box1">i am a box</div>
    <div class="box box2">i am a another box</div>

</body>

</html>
