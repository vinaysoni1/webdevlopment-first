<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXERCISE-08</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        
        .ball{
            height: 121px;
            width:121px;
            background-color:red;
           border-radius: 60px;
           position:absolute;
           bottom: 0;
           left:0;
           margin-bottom: 0%;
           animation: animateX 3s linear infinite, animateY 1s ease-out infinite;
        }
        .container{
            position: relative;
            height: 80vh;
            width: 120vw;
            background-color: aqua;
        }
        @keyframes animateX{
            from{
                left: 0%;

            }
            to{
                  left: 100% ;
            }
        }
         @keyframes animateY{
            from{
                    bottom: 0%;
            }
            to{
                bottom: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ball">

        </div>
    </div>
    
</body>
</html>
