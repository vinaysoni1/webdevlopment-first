<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selector</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style
        /* element selector */
        div{
            /* background-color: red; */
        }
        /* class selector */
        .red{
            background-color: red;
        }
        /* ID selector */
        #green{
            background-color: green;
        }
        /* CHILD selecter */
        div>{
            background-color: aqua;
            color: blue;
        }
        /* desending selector */
        div p{
            background-color: grey;
            color: blue;
        }
        /* Universal selector */
        *{
            margin: 0;
            padding: 0;
        }
        /* pseudo selecter */
        a:visited{
            color:red;
        }
        a:link{
            color: yellow;
        }
        a:active{
            background-color: hotpink;
        }
        a:hover{
            background-color: black;
        }
        a:focus{
            background-color: blue;
        }
        /* Child selector  */
        p:first-child{
            background-color: pink;
        }
       p:last-child{
            background-color: rgb(0, 119, 255);
        }
    </style>
</head>
<body>
    <main class="one">
        <p>i am first</p>
        <p>i am second</p>
    </main>
    <div id="green">
        i am a div
        <article>
        <p>i am a inside div</p>
        </article>
    </div>
    <div class="red">
        i am a another div
    </div>
    <a href="http//www.google.com">go to Google</a>
    <a href="http//www.facebook.com">go to Facebook</a>
</body>
</html>
